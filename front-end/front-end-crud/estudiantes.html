<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estudiantes Inscritos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <!-- Header / Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html"><i class="bi bi-mortarboard-fill me-2"></i>Sistema Estudiantes</a>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Registrar Estudiante</a></li>
          <li class="nav-item"><a class="nav-link active fw-bold" href="estudiantes.html">Ver Inscritos</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-2">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h3 class="fw-bold text-dark mb-0">Estudiantes Inscritos</h3>
    </div>

    <div class="row g-4" id="contenedorCards">
    </div>
  </main>

  <div class="modal fade" id="modalEditar" tabindex="-1" aria-labelledby="modalEditarLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow">
        <div class="modal-header bg-primary text-white">
          <h5 class="modal-title fw-bold" id="modalEditarLabel">Actualizar Estudiante</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body p-4">
          <form id="formActualizar">
            <input type="hidden" id="edit_id_estudiante">
            
            <div class="mb-3">
              <label for="edit_nombre_estudiante" class="form-label fw-semibold">Nombre del Estudiante</label>
              <input type="text" class="form-control" id="edit_nombre_estudiante" required>
            </div>

            <div class="mb-3">
              <label for="edit_carrera_estudiante" class="form-label fw-semibold">Carrera</label>
              <select class="form-select" id="edit_carrera_estudiante" required>
                <option value="Ingeniería en Sistemas">Ingeniería en Sistemas</option>
                <option value="Licenciatura en Administración">Licenciatura en Administración</option>
                <option value="Técnico en Desarrollo Web">Técnico en Desarrollo Web</option>
              </select>
            </div>

            <div class="d-flex justify-content-end gap-2 mt-4">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
              <button type="submit" class="btn btn-primary">Guardar Cambios</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/script_actualizacion_estudiante.js"></script>
</body>
</html>
