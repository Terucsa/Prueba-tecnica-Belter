<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrar Estudiante</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html"><i class="bi bi-mortarboard-fill me-2"></i>Sistema Estudiantes</a>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link active fw-bold" href="index.html">Registrar Estudiante</a></li>
          <li class="nav-item"><a class="nav-link" href="estudiantes.html">Ver Inscritos</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-6">
        <div class="card border-0 shadow-sm rounded-3">
          <div class="card-header bg-white border-0 pt-4 px-4">
            <h4 class="fw-bold mb-0 text-primary">Inscripción de Estudiante</h4>
            <p class="text-muted small">Ingresa la información requerida para el registro</p>
          </div>
          <div class="card-body p-4">
            <form id="formEstudiante">
              
              <div class="mb-3">
                <label for="nombre_estudiante" class="form-label fw-semibold">Nombre Completo</label>
                <input type="text" class="form-control" id="nombre_estudiante" name="nombre_estudiante" placeholder="Ej. Juan Pérez" required>
              </div>

              <div class="mb-3">
                <label for="edad_estudiante" class="form-label fw-semibold">Edad</label>
                <input type="number" class="form-control" id="edad_estudiante" name="edad_estudiante" min="15" max="100" placeholder="Ej. 20" required>
              </div>

              <div class="mb-3">
                <label for="carrera_estudiante" class="form-label fw-semibold">Carrera</label>
                <select class="form-select" id="carrera_estudiante" name="carrera_estudiante" required>
                  <option value="" selected disabled>Seleccione una carrera...</option>
                  <option value="Ingeniería en Sistemas">Ingeniería en Sistemas</option>
                  <option value="Licenciatura en Administración">Licenciatura en Administración</option>
                  <option value="Técnico en Desarrollo Web">Técnico en Desarrollo Web</option>
                </select>
              </div>

              <div class="mb-4 form-check form-switch">
                <input class="form-check-input" type="checkbox" role="switch" id="inscripcion_estudiante" name="inscripcion_estudiante" checked>
                <label class="form-check-label fw-semibold" for="inscripcion_estudiante">Estudiante Activo / Inscrito</label>
              </div>

              <div class="d-grid">
                <button type="submit" class="btn btn-primary py-2 fw-semibold">
                  <i class="bi bi-save me-1"></i> Guardar Estudiante
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>
</body>
<script src="./js/script.js"></script>
</html>
