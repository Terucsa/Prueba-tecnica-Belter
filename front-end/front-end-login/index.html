<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión</title>
  <link rel="stylesheet" href="./css/style.css">k
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 py-4">

  <main class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">
        
        <div class="card login-card p-4 p-sm-5 bg-white">
          
          <!-- Encabezado / Logo -->
          <div class="text-center mb-4">
            <div class="bg-primary text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 60px; height: 60px;">
              <i class="bi bi-person-circle fs-2"></i>
            </div>
            <h1 class="h4 fw-bold mb-1">Bienvenido</h1>
            <p class="text-muted small">Ingresa tus credenciales para acceder</p>
          </div>

          <!-- Formulario de Login -->
          <form action="/login" id="loginForm">
            
            <!-- Campo Usuario -->
            <div class="mb-3">
              <label for="username" class="form-label fw-semibold">Nombre de usuario</label>
              <div class="input-group">
                <span class="input-group-text text-muted" id="user-addon">
                  <i class="bi bi-person"></i>
                </span>
                <input 
                  type="text" 
                  class="form-control" 
                  id="nombre_usuario" 
                  name="nombre_usuario" 
                  placeholder="ej. usuario123" 
                  aria-label="Nombre de usuario" 
                  aria-describedby="user-addon"
                  required
                  autocomplete="username"
                >
              </div>
            </div>

            <!-- Campo Contraseña -->
            <div class="mb-4">
              <div class="d-flex justify-content-between align-items-center mb-1">
                <label for="password" class="form-label fw-semibold mb-0">Contraseña</label>
              </div>
              <div class="input-group">
                <span class="input-group-text text-muted" id="password-addon">
                  <i class="bi bi-lock"></i>
                </span>
                <input 
                  type="password" 
                  class="form-control" 
                  id="contrasenia_usuario" 
                  name="contrasenia_usuario" 
                  placeholder="••••••••" 
                  aria-label="Contraseña" 
                  aria-describedby="password-addon"
                  required
                  autocomplete="current-password"
                >
              </div>
            </div>

            <!-- Botón de Envío -->
            <div class="d-grid gap-2">
              <button type="submit" class="btn btn-primary btn-lg fs-6 fw-semibold py-2">
                Iniciar Sesión
              </button>
            </div>

          </form>

        </div>

        <!-- Pie de página o Copyright -->
        <div class="text-center mt-4 text-muted small">
          &copy; 2026 Todos los derechos reservados.
        </div>

      </div>
    </div>
  </main>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./js/script.js"></script>
</body>
</html>
